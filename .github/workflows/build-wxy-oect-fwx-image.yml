#==========================================================================
# Build Armbian trixie server image for wxy-oect (RK3566)
# with the patched 6.12.118-fwx kernel and fwx.ko pre-injected.
# Based on build-armbian-arm64-server-image.yml, customized for DPI.
#==========================================================================

name: Build wxy-oect Armbian trixie image (fwx DPI)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-wxy-oect-fwx-image.yml'

permissions:
  contents: write

env:
  TZ: Etc/UTC
  ROOTFS_SCRIPT: compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh
  KERNEL_VER: "6.12.118"
  KERNEL_NAME: "6.12.118-fwx"
  KERNEL_REPO_TAG: "kernel-fwx-6.12"
  FWX_KO_REPO_TAG: "fwx-ko-6.12"
  BOARD: "wxy-oect"
  RELEASE: "trixie"

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download Armbian source code
        id: down
        working-directory: /builder
        run: |
          rm -rf build
          git clone -q --single-branch --depth=1 --branch=main https://github.com/armbian/build.git build
          # Local action (uses: ./) runs with action_path == workspace, so the rebuild
          # script only needs ./build at the repo root. The original _actions/ symlink
          # is only required when using 'uses: ophub/...@main' and must not be used here.
          ln -sfn /builder/build "${{ github.workspace }}/build"
          ls -ld "${{ github.workspace }}/build"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Compile base Armbian rootfs
        id: compile
        working-directory: /builder
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || true
          cd build/
          ./compile.sh RELEASE=${{ env.RELEASE }} BOARD=odroidn2 BRANCH=current BUILD_MINIMAL=no \
                       BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
                       COMPRESS_OUTPUTIMAGE="sha" SHARE_LOG=yes
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Organize output files and reclaim disk space
        id: clean
        run: |
          chmod +x ${ROOTFS_SCRIPT}
          ${ROOTFS_SCRIPT} -v ${{ env.RELEASE }} -s true -c true -k true -p arm64
          cd build/
          rm -rf $(ls . | grep -v "^output$" | xargs) 2>/dev/null
          echo "build_tag=Armbian_${{ env.RELEASE }}_arm64_server_${{ env.BOARD }}_fwx_$(date +"%Y.%m")" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      # ---- Inject patched kernel + fwx.ko (before rebuild) ----
      - name: Prepare local patched kernel package
        id: kprep
        run: |
          set -e
          echo "Downloading patched kernel ${{ env.KERNEL_NAME }} from ${{ env.KERNEL_REPO_TAG }}"
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://github.com/${{ github.repository }}/releases/download/${{ env.KERNEL_REPO_TAG }}/${{ env.KERNEL_VER }}.tar.gz" \
            -o /tmp/kernel-fwx.tar.gz
          mkdir -p "${{ github.workspace }}/build-armbian/kernel/rk35xx"
          tar -xzf /tmp/kernel-fwx.tar.gz -C "${{ github.workspace }}/build-armbian/kernel/rk35xx"
          KDIR="${{ github.workspace }}/build-armbian/kernel/rk35xx/${{ env.KERNEL_VER }}"
          echo "Kernel dir: ${KDIR}"
          ls -lh "${KDIR}"
          for f in boot-${{ env.KERNEL_NAME }}.tar.gz dtb-rockchip-${{ env.KERNEL_NAME }}.tar.gz \
                   modules-${{ env.KERNEL_NAME }}.tar.gz header-${{ env.KERNEL_NAME }}.tar.gz sha256sums; do
            [[ -s "${KDIR}/${f}" ]] || { echo "ERROR: missing ${f}"; exit 1; }
          done
          echo "All 4 kernel packages + sha256sums present. OK"

      - name: Inject fwx.ko into common-files
        id: fwxprep
        run: |
          set -euo pipefail
          # NOTE: the rebuild action's armbian_files copy uses a relative target while
          # CWD is build/output/images, so it silently no-ops. We therefore write the
          # files straight into armbian-files/common-files, which copy_files() always
          # copies into the final rootfs.
          COMMON="${{ github.workspace }}/build-armbian/armbian-files/common-files"
          [[ -d "${COMMON}" ]] || { echo "ERROR: common-files dir not found: ${COMMON}"; exit 1; }
          mkdir -p "${COMMON}/usr/local/lib/fwx" \
                   "${COMMON}/etc/systemd/system/multi-user.target.wants"
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://github.com/hubhike/fanchmwrt/releases/download/${{ env.FWX_KO_REPO_TAG }}/fwx-${{ env.KERNEL_NAME }}.ko" \
            -o "${COMMON}/usr/local/lib/fwx/fwx.ko"
          echo '' | base64 -d > "${COMMON}/etc/systemd/system/fwx-dpi.service"
          ln -sfn ../fwx-dpi.service "${COMMON}/etc/systemd/system/multi-user.target.wants/fwx-dpi.service"
          chmod 0644 "${COMMON}/usr/local/lib/fwx/fwx.ko"
          chmod 0644 "${COMMON}/etc/systemd/system/fwx-dpi.service"
          echo "=== fwx-dpi.service ==="
          cat "${COMMON}/etc/systemd/system/fwx-dpi.service"
          echo "=== sha256 ==="
          sha256sum "${COMMON}/usr/local/lib/fwx/fwx.ko"
          test -s "${COMMON}/usr/local/lib/fwx/fwx.ko"
          test -f "${COMMON}/etc/systemd/system/fwx-dpi.service"
          test -L "${COMMON}/etc/systemd/system/multi-user.target.wants/fwx-dpi.service"
          echo "fwx.ko + unit injected into common-files OK"

      - name: Rebuild Armbian image with patched kernel
        uses: ./
        if: ${{ steps.clean.outputs.status == 'success' && steps.kprep.outcome == 'success' && steps.fwxprep.outcome == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ env.BOARD }}
          armbian_kernel: ${{ env.KERNEL_VER }}
          auto_kernel: 'false'
          kernel_repo: ophub/kernel
          kernel_usage: stable
          armbian_fstype: ext4
          builder_name: fwx

      - name: Upload image to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### wxy-oect Armbian trixie image with FanchmWrt DPI
            - Kernel: `${{ env.KERNEL_NAME }}` (patched: struct nf_conn.fwx_data + fwx hooks)
            - fwx.ko: pre-injected at `/usr/local/lib/fwx/fwx.ko`, auto-loaded via `fwx-dpi.service`
            - Default user: `root` / password: `1234`
            - DPI managed by Docker OpenWrt (host network) fwxd via netlink id 29
            ### Verify after boot
            - `uname -r` -> `${{ env.KERNEL_NAME }}`
            - `lsmod | grep fwx`
            - `dmesg | grep -i fwx`
            - `ls /proc/net/ | grep -E '^af_|^fwx'`
