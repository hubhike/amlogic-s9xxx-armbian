name: Compile kernel 6.12 with FanchmWrt fwx DPI patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compile-kernel-fwx.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify fwx patch is present
        run: |
          PATCH="compile-kernel/tools/patch/linux-6.12.y/950-fwx-nf-conn-struct-user-hook.patch"
          if [ ! -s "$PATCH" ]; then echo "ERROR: patch missing"; exit 1; fi
          echo "Patch OK: $(wc -c < "$PATCH") bytes"
          grep -q "nf_fwx_user_conn_del" "$PATCH" || { echo "ERROR: patch content unexpected"; exit 1; }
      - name: Initialize build environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null || true
          sudo swapoff -a; sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo apt-get clean
      - name: Create virtual disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [ "$root_size" -gt 0 ] || { echo "Insufficient space"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "$dev"
          sudo mkdir -p /builder
          sudo mount "$dev" /builder
          sudo chown -R runner:runner /builder
          df -Th
      - name: Get kernel source hash
        id: hash
        run: |
          sha=$(curl -fsSL -m 20 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/unifreq/linux-6.12.y/git/ref/heads/main | jq -r '.object.sha')
          [ -z "$sha" ] && sha="${{ github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /builder/ccache
          key: kernel-fwx-6.12-${{ steps.hash.outputs.sha }}
          restore-keys: kernel-fwx-6.12-
      - name: Compile kernel 6.12 with fwx patch
        uses: hubhike/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_source: unifreq
          kernel_version: 6.12.y
          kernel_auto: true
          auto_patch: true
          kernel_package: all
          kernel_sign: -fwx
          kernel_toolchain: gcc
          delete_source: false
          enable_log: true
          docker_hostpath: /builder
          docker_image: ophub/armbian-resolute:arm64
      - name: Verify and report
        run: |
          echo "PACKAGED_STATUS=${{ env.PACKAGED_STATUS }}"
          ls -lh ${{ env.PACKAGED_OUTPUTPATH }} 2>/dev/null || true
          grep -ihE "fwx|950-fwx|patch.*(succe|fail)" /var/log/kernel_compile_*.log 2>/dev/null | tail -40 || true
      - name: Upload kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel-fwx-6.12
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: Kernel 6.12 with FanchmWrt fwx DPI patch. Testing only.
