#==========================================================================
# Verify the built wxy-oect image really contains the patched kernel + fwx.ko
# Downloads the release image, mounts its partitions read-only and asserts
# that every DPI-related file is in place.
#==========================================================================

name: Verify wxy-oect fwx image

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-wxy-oect-image.yml'

permissions:
  contents: read

env:
  TAG: "Armbian_trixie_arm64_server_wxy-oect_fwx_2026.11"
  IMG: "Armbian_26.11.0_rockchip_wxy-oect_trixie_6.12.118_server_2026.11.24.img.gz"
  KO_SHA256: "511fb6c4f8d618e03a042a1dfced699cf3e258cb92b05f9491513c55198b3113"

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and decompress image
        run: |
          set -e
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/image.img.gz \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/${IMG}"
          ls -lh /tmp/image.img.gz
          gunzip -f /tmp/image.img.gz
          ls -lh /tmp/image.img
          df -h /tmp | tail -1

      - name: Mount partitions read-only
        run: |
          set -e
          LOOP=$(sudo losetup -f --show -P /tmp/image.img)
          echo "LOOP_DEV=${LOOP}" >> "${GITHUB_ENV}"
          sudo partprobe "${LOOP}" || true
          sleep 3
          ls -l "${LOOP}"* || true
          sudo mkdir -p /mnt/boot /mnt/root
          sudo mount -o ro "${LOOP}p1" /mnt/boot || sudo mount -t vfat -o ro "${LOOP}p1" /mnt/boot
          sudo mount -o ro "${LOOP}p2" /mnt/root
          echo "=== p1 mounted ==="
          sudo ls -l /mnt/boot | head -30
          echo "=== p2 rootfs top level ==="
          sudo ls -1 /mnt/root | head -30

      - name: Inspect target files
        run: |
          set -e
          echo "=== /usr/local/lib/fwx ==="
          sudo ls -l /mnt/root/usr/local/lib/fwx/ || echo "MISSING_DIR"
          echo "=== unit file ==="
          sudo cat /mnt/root/etc/systemd/system/fwx-dpi.service || echo "MISSING_UNIT"
          echo "=== enable symlink ==="
          sudo ls -l /mnt/root/etc/systemd/system/multi-user.target.wants/ | grep -i fwx || echo "MISSING_LINK"
          echo "=== /usr/lib/modules ==="
          sudo ls -1 /mnt/root/usr/lib/modules/
          echo "=== kernel headers ==="
          sudo ls -1d /mnt/root/usr/src/linux-headers-* || true
          echo "=== boot files with kernel signature ==="
          sudo find /mnt/boot -maxdepth 2 -name '*6.12.118-fwx*' -printf '%y %p\n' || true
          echo "=== extlinux.conf ==="
          sudo cat /mnt/boot/extlinux/extlinux.conf 2>/dev/null || sudo cat /mnt/boot/extlinux.conf 2>/dev/null || echo "NO_EXTLINUX"
          echo "=== dtb present? ==="
          sudo find /mnt/boot -name 'rk3566-wxy-oec-turbo-4g.dtb' -printf '%p\n' || true

      - name: Assert content
        run: |
          set +e
          fail=0
          check() { if sudo test -e "$1"; then echo "OK   $1"; else echo "FAIL $1"; fail=1; fi; }
          check /mnt/root/usr/local/lib/fwx/fwx.ko
          check /mnt/root/etc/systemd/system/fwx-dpi.service
          check /mnt/root/etc/systemd/system/multi-user.target.wants/fwx-dpi.service
          check /mnt/root/usr/lib/modules/6.12.118-fwx
          check /mnt/root/usr/src/linux-headers-6.12.118-fwx

          echo "=== ko sha256 (expect ${KO_SHA256}) ==="
          ACTUAL=$(sudo sha256sum /mnt/root/usr/local/lib/fwx/fwx.ko 2>/dev/null | awk '{print $1}')
          echo "actual: ${ACTUAL}"
          if [[ "${ACTUAL}" == "${KO_SHA256}" ]]; then
            echo "OK   fwx.ko sha256 matches"
          else
            echo "FAIL fwx.ko sha256 mismatch or missing"
            fail=1
          fi

          echo "=== vermagic inside image ko ==="
          sudo strings /mnt/root/usr/local/lib/fwx/fwx.ko 2>/dev/null | grep -m1 '6.12.118' || echo "NO_VERMAGIC_STRING"

          if [[ "${fail}" -ne 0 ]]; then
            echo "::error::Image verification FAILED"
            exit 1
          fi
          echo "Image verification PASSED"

      - name: Unmount
        if: always()
        run: |
          sudo umount -l /mnt/root 2>/dev/null || true
          sudo umount -l /mnt/boot 2>/dev/null || true
          sudo losetup -d "${LOOP_DEV}" 2>/dev/null || true
